[tool.pytest.ini_options]
markers = [
    "ollama: tests requiring a running Ollama instance",
]
addopts = "-m 'not ollama'"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["pandas", "streamlit"]
known-first-party = ["app", "src"]

[tool.mypy]
python_version = "3.14"
strict = true
