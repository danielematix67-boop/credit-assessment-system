rules:
  - rule_id: R001
    rule_name: Revenue growth deterioration
    indicator: Revenue growth
    category: revenue
    input_field: revenue_growth
    trigger_operator: LT
    threshold: -0.10
    severity: MEDIUM
    severity_direction: LOWER_IS_WORSE
    severity_thresholds:
      - threshold: -0.10
        severity: MEDIUM
      - threshold: -0.30
        severity: HIGH
    comment_template: >-
      Revenue growth stands at {value:.1%}, below the acceptable level,
      indicating a deterioration in the top-line trend.

  - rule_id: R002
    rule_name: Negative EBITDA
    indicator: EBITDA
    category: profitability
    input_field: ebitda
    trigger_operator: LT
    threshold: 0.0
    severity: HIGH
    severity_direction: LOWER_IS_WORSE
    comment_template: >-
      EBITDA is negative at {value:,.0f}, indicating negative operating
      profitability.

  - rule_id: R003
    rule_name: EBITDA margin deterioration
    indicator: EBITDA margin
    category: profitability
    input_field: ebitda_margin
    trigger_operator: LT
    threshold: 0.0
    severity: MEDIUM
    severity_direction: LOWER_IS_WORSE
    severity_thresholds:
      - threshold: 0.0
        severity: MEDIUM
      - threshold: -0.10
        severity: HIGH
    comment_template: >-
      EBITDA margin stands at {value:.1%}, indicating weak operating
      profitability relative to revenue.

  - rule_id: R004
    rule_name: nfp / EBITDA leverage
    indicator: NFP / EBITDA
    category: leverage
    input_field: nfp_to_ebitda
    trigger_operator: GT
    threshold: 5.0
    severity: MEDIUM
    severity_direction: HIGHER_IS_WORSE
    severity_thresholds:
      - threshold: 5.0
        severity: MEDIUM
      - threshold: 7.0
        severity: HIGH
    comment_template: >-
      NFP to EBITDA stands at {value:.1f}x, above the acceptable level,
      indicating elevated leverage relative to operating earnings.

  - rule_id: R005
    rule_name: Interest expense to EBITDA
    indicator: Interest expense / EBITDA
    category: profitability
    input_fields:
      - interest_expense
      - ebitda
    calculation: ratio
    trigger_operator: GT
    threshold: 0.60
    severity: MEDIUM
    severity_direction: HIGHER_IS_WORSE
    severity_thresholds:
      - threshold: 0.60
        severity: MEDIUM
      - threshold: 1.00
        severity: HIGH
    comment_template: >-
      Interest expense to EBITDA stands at {value:.1%}, above the acceptable
      level, indicating a relatively high interest burden relative to
      operating earnings.

  - rule_id: R006
    rule_name: EBITDA materially supported by finished goods inventory increase
    indicator: Finished goods inventory increase / EBITDA
    category: profitability_quality
    input_fields:
      - change_in_finished_goods_inventory
      - ebitda
    calculation: ratio
    trigger_operator: GT
    threshold: 0.30
    severity: MEDIUM
    severity_direction: HIGHER_IS_WORSE
    severity_thresholds:
      - threshold: 0.30
        severity: MEDIUM
      - threshold: 0.50
        severity: HIGH
    comment_template: >-
      EBITDA is materially supported by an increase in finished goods
      inventory, indicating weaker cash conversion quality.

  - rule_id: R007
    rule_name: Interest coverage ratio
    indicator: Interest coverage ratio
    category: profitability
    input_fields:
      - ebitda
      - interest_expense
    calculation: ratio
    trigger_operator: LT
    threshold: 2.0
    severity: MEDIUM
    severity_direction: LOWER_IS_WORSE
    severity_thresholds:
      - threshold: 2.0
        severity: MEDIUM
      - threshold: 1.0
        severity: HIGH
    comment_template: >-
      The interest coverage ratio is {value:.1f}x, indicating that EBITDA
      provides limited coverage of interest expense.

  - rule_id: R008
    rule_name: Operating leverage
    indicator: Contribution margin / EBIT
    category: operating_leverage
    input_fields:
      - contribution_margin
      - net_operating_margin
    calculation: ratio
    trigger_operator: GT
    threshold: 3.0
    severity: MEDIUM
    severity_direction: HIGHER_IS_WORSE
    severity_thresholds:
      - threshold: 3.0
        severity: MEDIUM
      - threshold: 5.0
        severity: HIGH
    comment_template: >-
      The operating leverage ratio stands at {value:.1f}x, indicating high
      operating leverage and a relatively high fixed operating cost base.
      This means that changes in revenue may have a magnified impact on EBIT.

  - rule_id: R009
    rule_name: Operating grants incidence on production value
    indicator: Operating grants / production value
    category: profitability_quality
    input_fields:
      - operating_grants
      - production_value
    calculation: ratio
    trigger_operator: GT
    threshold: 0.10
    severity: MEDIUM
    severity_direction: HIGHER_IS_WORSE
    severity_thresholds:
      - threshold: 0.10
        severity: MEDIUM
      - threshold: 0.20
        severity: HIGH
    comment_template: >-
      Operating grants represent {value:.1%} of total production value,
      indicating a material reliance on operating contributions to support
      reported production value and potentially reducing the resilience of
      operating performance if such contributions decline.

  - rule_id: R010
    rule_name: Sustained increase in bank debt vs historical average
    indicator: Current bank-debt growth minus historical average growth
    category: leverage
    input_field: bank_debt_current
    trigger_operator: GT
    threshold: 0.10
    severity: MEDIUM
    severity_direction: HIGHER_IS_WORSE
    severity_thresholds:
      - threshold: 0.10
        severity: MEDIUM
      - threshold: 0.20
        severity: HIGH
    comment_template: >-
      Current bank-debt growth exceeds its historical average by {value:.1%},
      indicating a material acceleration in bank borrowing.

  - rule_id: R011
    rule_name: Increase in trade payables vs historical average
    indicator: Current trade-payables growth minus historical average growth
    category: working_capital
    input_field: trade_payables_current
    trigger_operator: GT
    threshold: 0.10
    severity: MEDIUM
    severity_direction: HIGHER_IS_WORSE
    severity_thresholds:
      - threshold: 0.10
        severity: MEDIUM
      - threshold: 0.20
        severity: HIGH
    comment_template: >-
      Current trade-payables growth exceeds its historical average by {value:.1%},
      indicating a material acceleration in supplier financing and potentially
      increased pressure on working-capital management.

  
  - rule_id: R012
    rule_name: Increase in average payment days vs historical average
    indicator: Current increase in average payment days minus historical average increase
    category: working_capital
    input_field: avg_payment_days_current
    trigger_operator: GT
    threshold: 10.0
    severity: MEDIUM
    severity_direction: HIGHER_IS_WORSE
    severity_thresholds:
      - threshold: 10.0
        severity: MEDIUM
      - threshold: 20.0
        severity: HIGH
    comment_template: >-
      Average payment days have increased by {value:.1f} days more than the
      historical average increase, indicating potential pressure on liquidity
      and greater reliance on supplier credit.
